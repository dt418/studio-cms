pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,astro}'
      run: pnpm exec eslint --config eslint.config.js {staged_files}
      stage_fixed: true

    typecheck:
      glob: '*.{ts,tsx,astro}'
      run: pnpm typecheck

    a11y-patterns:
      glob: '*.{astro,ts,tsx}'
      run: pnpm lint:patterns

    format:
      glob: '*.{ts,tsx,astro,css,json,md}'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

    markdownlint:
      glob: '*.md'
      run: pnpm lint:md

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  # Keep test and build sequential to avoid Vitest worker starvation while
  # Astro/Vite consumes the same CPU and memory on developer machines.
  parallel: false
  commands:
    test:
      run: pnpm test

    build:
      run: pnpm build
