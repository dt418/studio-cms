pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm lint
      stage_fixed: true

    typecheck:
      glob: '*.{ts,tsx,astro}'
      run: pnpm typecheck

    a11y-patterns:
      glob: '*.{astro,ts,tsx}'
      run: pnpm lint:patterns

    format:
      run: pnpm format:check

    markdownlint:
      glob: '*.md'
      run: pnpm lint:md

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    test:
      run: pnpm test

    build:
      run: pnpm build
