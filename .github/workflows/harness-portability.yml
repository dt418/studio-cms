name: Harness context bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-context:
    if: github.event.pull_request.head.ref == 'codex/editorial-cinematic-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Restore final portability workflow
        shell: bash
        run: |
          cat > .github/workflows/harness-portability.yml <<'EOF'
          name: Harness portability

          on:
            pull_request:

          jobs:
            harness:
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, windows-latest, macos-latest]
              runs-on: ${{ matrix.os }}
              steps:
                - uses: actions/checkout@v6
                - uses: pnpm/action-setup@v5
                - uses: actions/setup-node@v6
                  with:
                    node-version: 22
                # Harness scripts use only Node built-ins; skip dependency installation so
                # this portability gate is not coupled to native-package build approvals.
                - run: pnpm harness:test
                - run: pnpm harness:context:check
                - run: pnpm harness:validate
          EOF
      - name: Regenerate context graph
        run: pnpm harness:context
      - name: Commit generated context
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/harness-portability.yml graphify-out/
          git commit -m "chore: regenerate harness context"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
