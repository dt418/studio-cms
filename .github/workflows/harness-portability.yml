name: Harness portability

on:
  pull_request:

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Harness scripts use only Node built-ins; skip dependency installation so
      # this portability gate is not coupled to native-package build approvals.
      - run: pnpm harness:test
      - id: context-check
        continue-on-error: true
        run: pnpm harness:context:check
      - if: steps.context-check.outcome == 'failure'
        run: pnpm harness:context
      - if: steps.context-check.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: harness-context-${{ matrix.os }}
          path: graphify-out
      - if: steps.context-check.outcome == 'failure'
        run: exit 1
      - run: pnpm harness:validate
