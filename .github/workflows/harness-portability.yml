name: Harness context graph push

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-context:
    if: github.event.pull_request.head.ref == 'codex/editorial-cinematic-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Restore canonical portability workflow in working tree
        shell: bash
        run: git show origin/main:.github/workflows/harness-portability.yml > .github/workflows/harness-portability.yml
      - name: Regenerate context graph for final workflow
        run: pnpm harness:context
      - name: Commit graph snapshot only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/
          if git diff --cached --quiet; then
            echo "Context graph already current"
            exit 0
          fi
          git commit -m "chore: regenerate harness context"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
